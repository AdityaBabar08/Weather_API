[build]                                                                                         
builder = "dockerfile"                                                                          
dockerfilePath = "Dockerfile"                                                                   
                                                                                                
[deploy]                                                                                        
startCommand = "dotnet WeatherApi.dll"                                                          
healthcheckPath = "/health"                                                                     
healthcheckTimeout = 300                                                                        
restartPolicyType = "ON_FAILURE"                                                                
restartPolicyMaxRetries = 10                                                                    